spring.application.name=nevcoin
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

spring.docker.compose.lifecycle-management=start-only

telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}
telegram.api-base-url=${TELEGRAM_API_BASE_URL:https://api.telegram.org}
telegram.long-poll-timeout-seconds=${TELEGRAM_LONG_POLL_TIMEOUT_SECONDS:30}
telegram.error-backoff-seconds=${TELEGRAM_ERROR_BACKOFF_SECONDS:5}

market.enabled=${MARKET_ENABLED:false}
market.poll-interval-ms=${MARKET_POLL_INTERVAL_MS:30000}
market.birdeye-api-key=${BIRDEYE_API_KEY:}
market.birdeye-base-url=${BIRDEYE_BASE_URL:https://public-api.birdeye.so}
market.chain=${MARKET_CHAIN:solana}
market.watch-mints=${MARKET_WATCH_MINTS:}
market.alerts-enabled=${MARKET_ALERTS_ENABLED:false}
market.alert-chat-ids=${MARKET_ALERT_CHAT_IDS:}
market.momentum-threshold-percent=${MARKET_MOMENTUM_THRESHOLD_PERCENT:5}
market.volume-spike-multiplier=${MARKET_VOLUME_SPIKE_MULTIPLIER:3}
market.liquidity-drop-threshold-percent=${MARKET_LIQUIDITY_DROP_THRESHOLD_PERCENT:20}
