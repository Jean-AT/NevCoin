spring.application.name=nevcoin
spring.profiles.default=local
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

spring.docker.compose.lifecycle-management=start-only

telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}
telegram.api-base-url=${TELEGRAM_API_BASE_URL:https://api.telegram.org}
telegram.long-poll-timeout-seconds=${TELEGRAM_LONG_POLL_TIMEOUT_SECONDS:30}
telegram.error-backoff-seconds=${TELEGRAM_ERROR_BACKOFF_SECONDS:5}

market.enabled=${MARKET_ENABLED:false}
market.poll-interval-ms=${MARKET_POLL_INTERVAL_MS:30000}
market.stream-enabled=${MARKET_STREAM_ENABLED:false}
market.stream-url=${MARKET_STREAM_URL:wss://mainnet.helius-rpc.com}
market.stream-channel=${MARKET_STREAM_CHANNEL:logsSubscribe}
market.stream-reconnect-delay-seconds=${MARKET_STREAM_RECONNECT_DELAY_SECONDS:5}
market.helius-api-key=${HELIUS_API_KEY:}
market.chain=${MARKET_CHAIN:solana}
market.watch-mints=${MARKET_WATCH_MINTS:}
market.overview.enabled=${MARKET_OVERVIEW_ENABLED:true}
market.overview.base-url=${MARKET_OVERVIEW_BASE_URL:https://api.dexscreener.com}
market.overview.chain-id=${MARKET_OVERVIEW_CHAIN_ID:solana}
market.overview.timeout-seconds=${MARKET_OVERVIEW_TIMEOUT_SECONDS:10}
market.alerts-enabled=${MARKET_ALERTS_ENABLED:false}
market.alert-chat-ids=${MARKET_ALERT_CHAT_IDS:}
market.momentum-threshold-percent=${MARKET_MOMENTUM_THRESHOLD_PERCENT:5}
market.volume-spike-multiplier=${MARKET_VOLUME_SPIKE_MULTIPLIER:3}
market.liquidity-drop-threshold-percent=${MARKET_LIQUIDITY_DROP_THRESHOLD_PERCENT:20}

discovery.minimum-liquidity-usd=${DISCOVERY_MINIMUM_LIQUIDITY_USD:10000}
discovery.minimum-volume24h-usd=${DISCOVERY_MINIMUM_VOLUME24H_USD:25000}
discovery.minimum-unique-traders5m=${DISCOVERY_MINIMUM_UNIQUE_TRADERS_5M:0}
discovery.candidate-ttl-minutes=${DISCOVERY_CANDIDATE_TTL_MINUTES:30}

wallet.helius-rpc-url=${HELIUS_RPC_URL:https://mainnet.helius-rpc.com}
wallet.helius-api-key=${HELIUS_API_KEY:}
wallet.enabled=${WALLET_ENABLED:false}
wallet.poll-interval-ms=${WALLET_POLL_INTERVAL_MS:60000}
wallet.alerts-enabled=${WALLET_ALERTS_ENABLED:false}
wallet.alert-chat-ids=${WALLET_ALERT_CHAT_IDS:}
