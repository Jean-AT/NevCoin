spring.application.name=nevcoin
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

spring.docker.compose.lifecycle-management=start-only

telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}
telegram.api-base-url=${TELEGRAM_API_BASE_URL:https://api.telegram.org}
telegram.long-poll-timeout-seconds=${TELEGRAM_LONG_POLL_TIMEOUT_SECONDS:30}
telegram.error-backoff-seconds=${TELEGRAM_ERROR_BACKOFF_SECONDS:5}
